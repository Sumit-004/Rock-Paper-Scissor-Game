<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME</title>
    <link rel="icon" href="gIcon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="heading">
        <h1><div class="icon"><img src="gIcon.png" id="icon"></div>ROCK ,PAPER ,SCISSORS GAME</h1>
    </div>
    <div class="container">
        <div class="element" id="rock">
            <img src="./images/rock.jpeg" alt="">
        </div>
        <div class="element" id="paper">
            <img src="./images/paper.jpeg" alt="">
        </div>
        <div class="element" id="scissors">
            <img src="./images/scissor.jpeg" alt="">
        </div>
    </div>
    <div class="scorecard">
        <div>
            <p id="user-score">0</p>
            <p>YOU</p>
        </div>
        <div>
            <p id="comp-score">0</p>
            <p>COMPUTER</p>
        </div>
    </div>
    <div class="result">
        <p id="msg">This Is Score Board</p>
    </div>
</body>
<script src="dom.js"></script>
</html>
